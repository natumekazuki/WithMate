name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint integration diff
        env:
          LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base = $env:LINT_BASE
          if (!$base) { throw 'Lint comparison base is missing.' }
          if ($base -match '^0+$') {
            $base = @() | git mktree
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            git cat-file -e "$base^{tree}"
            if ($LASTEXITCODE -ne 0) {
              git fetch --no-tags --depth=1 origin $base
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          npm.cmd run lint -- --base $base

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test shard ${{ matrix.shard }} / 3
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: npm.cmd run test:shard -- --shard=${{ matrix.shard }}/3

  ci:
    name: Typecheck and test
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - test
    if: ${{ always() }}

    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.typecheck.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            exit 1
          fi
