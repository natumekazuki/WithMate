name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test shard ${{ matrix.shard }} / 3
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect Windows terminal transport
        if: matrix.shard == 1
        shell: pwsh
        run: |
          @'
          const { spawn } = require('node-pty');
          const path = require('node:path');
          async function probe(useConptyDll) {
            const script = '[Console]::WriteLine("PROBE_BEFORE"); [Console]::Write("$([char]27)]633;P;WithMateActivity=probe;unknown$([char]7)"); [Console]::WriteLine("PROBE_AFTER"); exit';
            const terminal = spawn(path.join(process.env.SystemRoot, 'System32/WindowsPowerShell/v1.0/powershell.exe'), ['-NoProfile', '-EncodedCommand', Buffer.from(script, 'utf16le').toString('base64')], { cwd: process.cwd(), env: process.env, cols: 120, rows: 24, useConptyDll });
            let output = '';
            terminal.onData(data => { output += data; });
            await new Promise((resolve, reject) => {
              const timer = setTimeout(() => { terminal.kill(); reject(new Error('Probe timeout')); }, 15000);
              terminal.onExit(event => { clearTimeout(timer); console.log(JSON.stringify({ useConptyDll, output, exitCode: event.exitCode })); resolve(); });
            });
          }
          (async () => { await probe(false); await probe(true); process.exit(0); })().catch(error => { console.error(error); process.exit(1); });
          '@ | node

      - name: Test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: npm.cmd run test:shard -- --shard=${{ matrix.shard }}/3

  ci:
    name: Typecheck and test
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - test
    if: ${{ always() }}

    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.typecheck.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            exit 1
          fi
